<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d2a3a">
  <title>Tour Guide</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Start screen -->
  <section id="start" class="screen">
    <header class="top">
      <h1>Tour Guide</h1>
      <p class="sub">Your personal audio guide. Put your headphones in, pick what interests you, and start walking.</p>
    </header>

    <h2>What would you like to hear about?</h2>
    <div id="lens-chips" class="chips"></div>

    <h2>Where?</h2>
    <div class="segmented" role="radiogroup">
      <label><input type="radio" name="source" value="gps" checked> My location</label>
      <label><input type="radio" name="source" value="sim"> Simulated route</label>
    </div>

    <div id="sim-setup" hidden>
      <div class="row">
        <select id="sim-preset" aria-label="Preset route"></select>
      </div>
      <div class="row">
        <select id="sim-mode" aria-label="Travel mode">
          <option value="walk">Walk</option>
          <option value="bus">Bus / tram</option>
          <option value="drive">Drive</option>
        </select>
        <input id="sim-search" type="search" placeholder="Search a place to centre the map">
      </div>
      <p class="hint" id="sim-hint">Pick a preset, or tap the map to set a start point, then an end point.</p>
      <div id="sim-map" class="map"></div>
    </div>

    <details class="settings">
      <summary>Settings</summary>
      <label class="field">Voice
        <select id="voice-select"></select>
      </label>
      <label class="field">Speaking speed
        <input id="rate" type="range" min="0.8" max="1.3" step="0.05" value="1">
      </label>
      <label class="field check"><input id="media-keys" type="checkbox" checked> Headset play/pause button controls the tour</label>
      <label class="field check"><input id="show-debug" type="checkbox"> Show debug panel</label>
      <button id="test-voice" type="button" class="secondary">Test voice</button>
    </details>

    <div class="start-bar">
      <button id="start-btn" class="primary big" type="button">Start tour</button>
      <p class="hint" id="start-status"></p>
    </div>
  </section>

  <!-- Tour screen -->
  <section id="tour" class="screen" hidden>
    <div class="tour-top">
      <div id="active-lenses" class="active-lenses" title="Active lenses"></div>
      <div id="status" class="status">Starting…</div>
    </div>

    <div id="cards" class="cards" aria-live="polite"></div>

    <p id="caption" class="caption"></p>

    <div id="tour-map" class="map small"></div>

    <div id="sim-controls" class="sim-controls" hidden>
      <button id="sim-play" type="button" class="secondary">Pause walk</button>
      <select id="sim-speed" aria-label="Simulation speed">
        <option value="1">1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
        <option value="8">8×</option>
      </select>
      <button id="sim-turn" type="button" class="secondary">Turn around</button>
    </div>

    <details id="debug" class="debug" hidden>
      <summary>Debug</summary>
      <pre id="debug-text"></pre>
    </details>

    <div id="ask-fallback" class="ask-fallback" hidden>
      <input id="ask-input" type="text" placeholder="Type your question (speech recognition unavailable)">
      <button id="ask-send" type="button" class="secondary">Ask</button>
    </div>

    <div class="controls">
      <div class="secondary-row">
        <button id="replay-btn" type="button" class="secondary">Replay</button>
        <button id="skip-btn" type="button" class="secondary">Skip</button>
        <button id="stop-btn" type="button" class="danger">Stop</button>
      </div>
      <div class="main-row">
        <button id="pause-btn" type="button" class="primary">Pause</button>
        <button id="ptt-btn" type="button" class="ptt">Hold to talk</button>
      </div>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
