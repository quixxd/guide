<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guide</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { color-scheme: light dark; --bg: #faf9f7; --fg: #1c1b19; --muted: #6b6862; --line: #e2dfd9; --accent: #1f6fd1; --accent-fg: #fff; --err: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141414; --fg: #ececec; --muted: #9a978f; --line: #2c2b29; --accent: #4f9cf0; --accent-fg: #08111c; --err: #f2766d; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; }
  #map-wrap { flex: 1 1 auto; min-height: 40vh; position: relative; }
  #map { position: absolute; inset: 0; }
  #now { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 1000; display: flex; gap: 10px; align-items: center;
         background: rgb(20 20 20 / .78); color: #fff; border-radius: 12px; padding: 8px; backdrop-filter: blur(6px); max-width: 26rem; }
  #now[hidden] { display: none; }
  #now img { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; flex: 0 0 auto; }
  #now img[hidden] { display: none; }
  .now-text { display: flex; flex-direction: column; min-width: 0; }
  .now-text b { font-size: 1rem; line-height: 1.25; }
  .now-text a { color: #cfd8e3; font-size: .75rem; text-decoration: none; }
  #panel { flex: 0 0 auto; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  #place { margin: 0; font-weight: 600; min-height: 1.4em; }
  #status { margin: 0; color: var(--muted); min-height: 1.4em; }
  #status.err { color: var(--err); }
  #caption { margin: 0; min-height: 2.9em; max-height: 6em; overflow: hidden; }
  .controls { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
  .controls button { padding: 14px 8px; font: 600 1rem system-ui, sans-serif; border-radius: 12px; border: 1px solid var(--accent); background: transparent; color: var(--accent); touch-action: manipulation; }
  .controls button#main { background: var(--accent); color: var(--accent-fg); }
  .controls button:disabled { opacity: .35; }
  #meta { margin: 0; color: var(--muted); font-size: .8rem; }
  #debug { margin: 0; font: 11px/1.35 ui-monospace, monospace; white-space: pre-wrap; color: var(--muted); max-height: 30vh; overflow: auto; }
</style>
</head>
<body>
<div id="map-wrap">
  <div id="map"></div>
  <div id="now" hidden>
    <img id="now-photo" alt="" hidden>
    <div class="now-text"><b id="now-name"></b><a id="now-credit" target="_blank" rel="noopener"></a></div>
  </div>
</div>
<section id="panel">
  <p id="place"></p>
  <p id="status"></p>
  <p id="caption"></p>
  <div class="controls">
    <button id="main" type="button">Start</button>
    <button id="skip" type="button">Skip</button>
    <button id="stop" type="button">Stop</button>
  </div>
  <p id="meta"></p>
  <pre id="debug" hidden></pre>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
