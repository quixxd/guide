<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map styles</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { color-scheme: light dark; --bg: #faf9f7; --fg: #1c1b19; --muted: #6b6862; --line: #e2dfd9; --accent: #1f6fd1; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141414; --fg: #ececec; --muted: #9a978f; --line: #2c2b29; --accent: #4f9cf0; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  p.lead { margin: 0 0 12px; color: var(--muted); max-width: 46rem; }
  .places { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .places button { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font: inherit; }
  .places button.on { background: var(--accent); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  figure { margin: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .map { height: 280px; }
  figcaption { padding: 10px 12px; }
  figcaption b { display: block; }
  figcaption span { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<h1>Map styles</h1>
<p class="lead">Each map uses a different tile style with the same sample markers as the guide: your position in blue, places in orange, a covered place in grey, the place being talked about highlighted. Pan or zoom any map and the others follow.</p>
<div class="places">
  <button type="button" data-at="53.0757,8.8075" class="on">Bremen</button>
  <button type="button" data-at="38.7095,-9.1365">Lisbon</button>
  <button type="button" data-at="41.1415,-8.6125">Porto</button>
</div>
<div class="grid" id="grid"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const STYLES = [
    { name: "OpenStreetMap Standard", note: "Current. Detailed and busy.", url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png", attr: "© OpenStreetMap contributors" },
    { name: "CARTO Voyager", note: "Soft colours, clean labels. No key.", url: "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", attr: "© OpenStreetMap contributors © CARTO" },
    { name: "CARTO Positron", note: "Very light grey, minimal. No key.", url: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", attr: "© OpenStreetMap contributors © CARTO" },
    { name: "CARTO Dark Matter", note: "Dark and minimal, for dark mode. No key.", url: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", attr: "© OpenStreetMap contributors © CARTO" },
    { name: "OpenTopoMap", note: "Contours and hill shading. Slow; max zoom 17. No key.", url: "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", attr: "© OpenStreetMap contributors, SRTM | © OpenTopoMap (CC-BY-SA)", maxZoom: 17 },
    { name: "Esri World Imagery", note: "Satellite, no labels. Fine for testing; terms expect an ArcGIS account.", url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", attr: "Tiles © Esri, Maxar, Earthstar Geographics" },
  ];

  const maps = [];
  let syncing = false;
  let center = [53.0757, 8.8075];

  function samples(group, [lat, lon]) {
    group.clearLayers();
    const d = 0.0006;
    L.circleMarker([lat, lon], { radius: 8, color: "#fff", weight: 2, fillColor: "#1f6fd1", fillOpacity: 1 }).addTo(group);
    L.polyline([[lat, lon], [lat + d * 0.8, lon + d * 0.6]], { color: "#1f6fd1", weight: 3 }).addTo(group);
    L.circleMarker([lat + d, lon - d], { radius: 5, color: "#c2621f", weight: 1, fillColor: "#c2621f", fillOpacity: 0.9 }).addTo(group);
    L.circleMarker([lat - d * 0.7, lon + d * 1.4], { radius: 5, color: "#c2621f", weight: 1, fillColor: "#c2621f", fillOpacity: 0.9 }).addTo(group);
    L.circleMarker([lat - d * 1.2, lon - d * 0.8], { radius: 5, color: "#8a8f98", weight: 1, fillColor: "#8a8f98", fillOpacity: 0.5 }).addTo(group);
    L.circleMarker([lat + d * 1.3, lon + d * 1.1], { radius: 9, color: "#fff", weight: 2, fillColor: "#e0731f", fillOpacity: 0.9 }).addTo(group);
  }

  for (const style of STYLES) {
    const fig = document.createElement("figure");
    fig.innerHTML = `<div class="map"></div><figcaption><b></b><span></span></figcaption>`;
    fig.querySelector("b").textContent = style.name;
    fig.querySelector("span").textContent = style.note;
    document.getElementById("grid").append(fig);
    const map = L.map(fig.querySelector(".map"), { zoomControl: false }).setView(center, 17);
    L.tileLayer(style.url, { maxZoom: style.maxZoom ?? 19, subdomains: "abc", attribution: style.attr }).addTo(map);
    const group = L.layerGroup().addTo(map);
    samples(group, center);
    map.on("move", () => {
      if (syncing) return;
      syncing = true;
      for (const m of maps) if (m.map !== map) m.map.setView(map.getCenter(), map.getZoom(), { animate: false });
      syncing = false;
    });
    maps.push({ map, group });
  }

  for (const btn of document.querySelectorAll(".places button")) {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".places button").forEach((b) => b.classList.toggle("on", b === btn));
      center = btn.dataset.at.split(",").map(Number);
      syncing = true;
      for (const m of maps) {
        m.map.setView(center, 17, { animate: false });
        samples(m.group, center);
      }
      syncing = false;
    });
  }
</script>
</body>
</html>
